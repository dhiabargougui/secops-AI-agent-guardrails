name: AI SOC Proof-of-Work CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Open Policy Agent (OPA)
        run: |
          curl -L -o /usr/local/bin/opa https://github.com/open-policy-agent/opa/releases/download/v1.2.0/opa_linux_amd64_static
          curl -L -o /tmp/opa.sha256 https://github.com/open-policy-agent/opa/releases/download/v1.2.0/opa_linux_amd64_static.sha256
          echo "$(cat /tmp/opa.sha256 | awk '{print $1}')  /usr/local/bin/opa" | sha256sum -c -
          chmod +x /usr/local/bin/opa
          opa version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OPA Rego policy tests
        run: |
          opa test policies/ -v

      - name: Run full pytest test suite with coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-report=xml -v

      - name: Verify deterministic verification report drift
        run: |
          python scripts/generate_verification_report.py --check

